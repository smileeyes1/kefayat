<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17324d"><link rel="manifest" href="./manifest.webmanifest"><title>كفايات Ω — نظام التشغيل التعليمي الفلسطيني</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#172033;background:#f4f7fb;line-height:1.65}*{box-sizing:border-box}body{margin:0}.app{max-width:1280px;margin:auto;padding:14px}.top,.panel{background:#fff;border:1px solid #dbe3ec;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 6px 22px #1522380b}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.brand h1{margin:0}.muted{color:#64748b}.badge,.chip{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2f7;font-size:.8rem;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px;font-weight:800}.field input,.field select,.field textarea,button{font:inherit;border:1px solid #cbd5e1;border-radius:11px;padding:10px 12px;background:#fff}.field textarea{min-height:110px;resize:vertical}button{cursor:pointer;font-weight:800}button.primary{background:#17324d;color:#fff;border-color:#17324d}button.good{background:#0f766e;color:#fff;border-color:#0f766e}.tabs{display:flex;gap:7px;overflow:auto}.tab{white-space:nowrap}.tab.active{background:#17324d;color:#fff}.layout{display:grid;grid-template-columns:minmax(260px,.75fr) minmax(0,1.6fr);gap:12px}.list{max-height:540px;overflow:auto;border:1px solid #e2e8f0;border-radius:13px}.item{display:block;width:100%;text-align:right;border:0;border-bottom:1px solid #edf2f7;border-radius:0;background:#fff;padding:11px}.item.active{background:#edf5fb;border-right:4px solid #17324d}.item small{display:block;color:#64748b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{padding:12px;border:1px solid #e2e8f0;border-radius:13px;background:#fafcff}.card b{display:block;font-size:1.25rem}.actions{display:flex;gap:7px;flex-wrap:wrap}.status,.callout{padding:11px;border-radius:12px;background:#f8fafc;border:1px solid #dbe3ec}.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.warn{background:#fff8e8;border-color:#f2d79a}.danger{background:#fff1f2;border-color:#fecdd3;color:#9f1239}.trace{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.node{padding:9px;border:1px solid #dbe3ec;border-radius:10px;text-align:center;font-weight:800;background:#fafbfc}.output{white-space:pre-wrap;background:#fafcff;border:1px solid #dbe3ec;border-radius:13px;padding:14px;min-height:150px}.footer{text-align:center;color:#64748b;font-size:.8rem;padding:8px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.trace{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.app{padding:8px}}</style></head><body><main class="app"><header class="top"><div class="brand"><h1>كفايات Ω</h1><p class="muted">نظام تشغيل تعليمي ذكي ومهني وذاتي القيادة لخدمة المعلم والمتعلم والمدرسة والمنظومة التعليمية الفلسطينية.</p></div><div><span class="badge">Evidence-Governed</span> <span class="badge">Local-First</span> <span class="badge">Self-Directed</span></div></header><section class="panel"><div id="tabs" class="tabs"></div></section><section id="workspace"></section><footer class="footer">كفايات Ω · الدليل قبل الادعاء · الحكم المهني للإنسان · لا ادعاء بصلاحية عالمية من مجرد وجود التطبيق.</footer></main><script>'use strict';
const S={records:[],coverage:[],role:'teacher',selected:null,output:'',ledger:[]},$=id=>document.getElementById(id),ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]),esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const subjects={arabic:'العربية',mathematics:'الرياضيات',islamic_education:'التربية الإسلامية',nurturing:'التنشئة'},roles={teacher:'المعلم',student:'الطالب',supervisor:'المشرف',principal:'المدير',family:'الأسرة',leadership:'القيادة التعليمية'},KEY='kefayat.gemini.apiKey',USAGE='kefayat.gemini.dailyUsage',MODEL='gemini-2.5-flash-lite';
function usage(){try{let x=JSON.parse(localStorage.getItem(USAGE)||'{}');return x.date===new Date().toISOString().slice(0,10)?Number(x.count||0):0}catch(_){return 0}}function bump(){localStorage.setItem(USAGE,JSON.stringify({date:new Date().toISOString().slice(0,10),count:usage()+1}))}function key(){return localStorage.getItem(KEY)||''}function saveKey(k){k?localStorage.setItem(KEY,k):localStorage.removeItem(KEY)}function log(step,state,note){S.ledger.push({step,state,note});if(S.ledger.length>40)S.ledger.shift()}
function rows(g='all',s='all',q=''){q=q.trim().toLowerCase();return S.records.filter(r=>(g==='all'||String(r.grade)===g)&&(s==='all'||r.subject===s)&&(!q||[r.id,r.main_competency,r.sub_competency,r.domain,r.criterion,r.source_text].some(v=>String(v??'').toLowerCase().includes(q))))}
function tabs(){let x=Object.entries(roles).map(([k,v])=>`<button class="tab ${S.role===k?'active':''}" data-role="${k}">${v}</button>`).join('');$('tabs').innerHTML=x+`<button class="tab ${S.role==='knowledge'?'active':''}" data-role="knowledge">المعرفة</button><button class="tab ${S.role==='ai'?'active':''}" data-role="ai">GEM AI</button><button class="tab ${S.role==='assurance'?'active':''}" data-role="assurance">الضمان Ω</button>`;document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;render()})}
function stats(){return `<div class="cards"><div class="card"><b>${ar(S.records.length)}</b>سجل كفاية</div><div class="card"><b>${ar(S.coverage.length)}</b>تغطية مصدر</div><div class="card"><b>١–٤</b>الصفوف الحالية</div><div class="card"><b>Ω</b>بوابة الضمان</div></div>`}
function roleView(){let d={teacher:'التخطيط والتصميم والتقويم.',student:'التعلم والممارسة والتغذية الراجعة.',supervisor:'الملاحظة والدليل وخطة التحسين.',principal:'تشغيل المدرسة ومؤشرات القرار.',family:'دعم تعلم الطالب عمليًا.',leadership:'قراءة الفجوات على مستوى مجمع.'}[S.role];return `<section class="panel"><h2>مساحة ${roles[S.role]}</h2><p class="muted">${d}</p>${stats()}</section><section class="panel"><div class="grid"><label class="field"><span>المادة</span><select id="rg"><option value="all">الكل</option><option value="arabic">العربية</option><option value="mathematics">الرياضيات</option><option value="islamic_education">التربية الإسلامية</option><option value="nurturing">التنشئة</option></select></label><label class="field"><span>الصف</span><select id="rs"><option value="all">الكل</option><option value="1">الأول</option><option value="2">الثاني</option><option value="3">الثالث</option><option value="4">الرابع</option></select></label><label class="field"><span>الغاية</span><input id="goal" placeholder="ما النتيجة التي تريد الوصول إليها؟"></label><div class="field"><span>التشغيل</span><button id="drive" class="primary">قد النظام المهمة</button></div></div><div id="roleOut" class="output">${S.output||'اكتب الغاية واضغط «قد النظام المهمة». سيختار النظام مراجع مناسبة من قاعدة المعرفة دون اختلاق مصادر.'}</div></section><section class="panel"><h3>القيادة الذاتية</h3><div class="trace">${['فهم الغاية','القيود','المعرفة','القرار','التصميم','التنفيذ','التحقق','الإصلاح','Regression','التحسين'].map(x=>`<div class="node">${x}</div>`).join('')}</div></section>`}
function knowledgeView(){return `<section class="panel"><h2>المعرفة والكفايات</h2><p class="muted">حالة المصدر محفوظة كما هي. لا يتحول المصدر المقدم إلى مصدر رسمي مثبت تلقائيًا.</p><div class="grid"><label class="field"><span>الصف</span><select id="kg"><option value="all">الكل</option><option value="1">الأول</option><option value="2">الثاني</option><option value="3">الثالث</option><option value="4">الرابع</option></select></label><label class="field"><span>المادة</span><select id="ks"><option value="all">الكل</option><option value="arabic">العربية</option><option value="mathematics">الرياضيات</option><option value="islamic_education">التربية الإسلامية</option><option value="nurturing">التنشئة</option></select></label><label class="field"><span>بحث</span><input id="kq" placeholder="ابحث في الكفايات"></label><div class="status" id="kstatus">${ar(S.records.length)} سجل</div></div></section><section class="layout"><section class="panel"><div id="klist" class="list"></div></section><section class="panel" id="kdetail">اختر كفاية.</section></section>`}
function renderKnowledge(){let z=rows($('kg').value,$('ks').value,$('kq').value);$('kstatus').textContent=ar(z.length)+' نتيجة';$('klist').innerHTML=z.length?z.slice(0,300).map(r=>`<button class="item ${S.selected?.id===r.id?'active':''}" data-id="${esc(r.id)}"><b>${esc(r.main_competency||r.sub_competency||r.id)}</b><small>الصف ${ar(r.grade)} · ${esc(subjects[r.subject]||r.subject)} · ${esc(r.id)}</small></button>`).join(''):'<div class="status warn">لا توجد نتائج.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{S.selected=S.records.find(r=>r.id===b.dataset.id)||null;renderKnowledge();detail()});detail()}
function detail(){let e=$('kdetail');if(!e)return;let r=S.selected;if(!r){e.textContent='اختر كفاية.';return}let o=Array.isArray(r.learning_outcomes)?r.learning_outcomes:[];e.innerHTML=`<h2>${esc(r.main_competency||r.sub_competency||r.id)}</h2><div class="actions"><span class="chip">${esc(r.id)}</span><span class="chip">الصف ${ar(r.grade)}</span><span class="chip">${esc(subjects[r.subject]||r.subject)}</span></div><h3>النص الأصلي</h3><div class="callout">${esc(r.source_text)}</div><h3>المعيار</h3><p>${esc(r.criterion||'غير محدد')}</p><h3>نتاجات التعلم</h3>${o.length?'<ul>'+o.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="muted">غير مسجلة.</p>'}<h3>التتبع</h3><p><b>حالة المصدر:</b> ${esc(r.provenance?.status||'غير محدد')}<br><b>المصدر:</b> ${esc(r.provenance?.source_id||'غير محدد')}<br><b>الموضع:</b> ${esc(r.provenance?.location||'غير محدد')}</p>`}
function aiView(){return `<section class="panel"><h2>GEM AI — Free-First</h2><p class="muted">المسار المحلي أولًا. Gemini اختياري، ومفتاحه يبقى على الجهاز. الحماية المحلية تقلل الاستهلاك لكنها لا تغيّر حصص Google الرسمية.</p><div class="grid"><label class="field"><span>مفتاح Gemini</span><input id="api" type="password" placeholder="اختياري"></label><label class="field"><span>الحد المحلي اليومي</span><input id="lim" type="number" min="1" max="100" value="20"></label><label class="field"><span>النمط</span><select id="mode"><option value="auto">تلقائي</option><option value="local">محلي فقط</option><option value="cloud">Gemini</option></select></label><div class="status">الاستخدام اليوم: ${ar(usage())}</div></div><label class="field" style="margin-top:10px"><span>المهمة</span><textarea id="prompt" placeholder="اكتب الغاية أو المهمة..."></textarea></label><div class="actions"><button id="save" class="primary">حفظ محلي</button><button id="ask" class="good">شغّل GEM</button></div><div id="aist" class="status">جاهز.</div><div id="aiout" class="output">${S.output||'لم تُنفذ مهمة بعد.'}</div></section>`}
function localAnswer(p){let r=S.selected||S.records[0];if(!r)return 'NOT PROVEN: لا توجد قاعدة معرفة متاحة.';return `المهمة: ${p}\nالمرجع: ${r.id}\nالكفاية: ${r.main_competency||r.sub_competency||'غير محددة'}\nالمعيار: ${r.criterion||'غير محدد'}\n\nالمسار:\n١. فهم الغاية والقيود.\n٢. اختيار المرجع.\n٣. تصميم أداء قابل للملاحظة.\n٤. جمع دليل.\n٥. التحقق.\n٦. إصلاح ما يفشل.\n٧. إعادة الاختبار.\n\nحد الدليل: أي معلومة غير موجودة في المرجع تبقى غير مثبتة.`}
async function askAI(){let p=$('prompt').value.trim();if(!p)return;$('aist').textContent='جارٍ التنفيذ والتحقق…';let m=$('mode').value,k=$('api').value.trim()||key(),lim=Math.max(1,Math.min(100,Number($('lim').value||20)));if(m==='local'||(!k&&m==='auto')||usage()>=lim){S.output=localAnswer(p);$('aiout').textContent=S.output;$('aist').textContent='تم التنفيذ محليًا دون استهلاك سحابي.';return}saveKey(k);let r=S.selected||S.records[0],ctx=r?JSON.stringify({id:r.id,grade:r.grade,subject:r.subject,competency:r.main_competency,criterion:r.criterion,source_text:r.source_text,provenance:r.provenance}):'لا يوجد مرجع';try{let body={contents:[{role:'user',parts:[{text:'أنت GEM داخل كفايات Ω. افهم الغاية. لا تختلق مصدرًا أو كفاية. عند نقص الدليل قل NOT PROVEN. افصل الحقيقة عن الاستنتاج والاقتراح. اجعل الناتج عمليًا وقابلًا للتحقق. المرجع:\n'+ctx+'\nالمهمة:\n'+p}]}],generationConfig:{temperature:.2,maxOutputTokens:1200}},res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+':generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await res.json();if(!res.ok)throw Error(d?.error?.message||('HTTP '+res.status));bump();S.output=d?.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('')||'لم يعد النموذج نصًا.';$('aiout').textContent=S.output;$('aist').textContent='تمت الإجابة من Gemini ضمن الحصة المتاحة.';log('AI','PASS','cloud response')}catch(e){S.output=localAnswer(p)+'\n\nسبب التحول: '+e.message;$('aiout').textContent=S.output;$('aist').textContent='فشل السحابة؛ تم التحول للمحلي.';$('aist').className='status danger';log('AI','FALLBACK',e.message)}}
function assuranceView(){return `<section class="panel"><h2>الضمان Ω</h2><p class="muted">فحص محلي عدائي أساسي: يبحث عن غياب المصدر والمعرف وحالة provenance قبل السماح بالحكم PASS.</p><button id="audit" class="primary">شغّل الفحص</button><div id="auditout" class="output">لم يبدأ.</div></section><section class="panel"><h3>سجل التشغيل</h3><div id="ledger">${S.ledger.map(x=>`<div class="status"><b>${esc(x.step)}</b> · ${esc(x.state)}<br>${esc(x.note)}</div>`).join('')}</div></section>`}
function audit(){let f=[];if(!S.records.length)f.push('قاعدة المعرفة فارغة');S.records.slice(0,50).forEach(r=>{if(!r.id||!r.source_text)f.push('سجل بلا معرف/مصدر');if(!r.provenance?.status)f.push('سجل بلا حالة مصدر')});let s=f.length?'NO-GO':'PASS';$('auditout').textContent=`النتيجة: ${s}\nتم فحص ${ar(Math.min(50,S.records.length))} سجل\n${f.length?'الإخفاقات:\n'+f.slice(0,20).join('\n'):'الفحص المحدد اجتاز.'}`;log('ASSURANCE',s,f.join('; ')||'local checks passed')}
function drive(){let g=$('rs').value,s=$('rg').value,p=$('goal').value.trim()||'تحسين التعلم';let z=rows(g,s,'').slice(0,5);log('UNDERSTAND','PASS','goal extracted');let out=`الغاية: ${p}\nالدور: ${roles[S.role]}\n\n`;if(!z.length){out+='NOT PROVEN: لا يوجد مرجع مطابق؛ لم يتم اختلاق مصدر.';log('DECIDE','BLOCKED','insufficient evidence')}else{out+='مراجع مقترحة:\n'+z.map((r,i)=>`${ar(i+1)}. ${r.id} — ${r.main_competency||r.sub_competency||'كفاية'}`).join('\n')+'\n\nالخطة:\n١. فهم الغاية.\n٢. اختيار المرجع.\n٣. تحويله إلى أداء قابل للملاحظة.\n٤. نشاط عملي.\n٥. دليل أداء.\n٦. تحقق.\n٧. إصلاح.\n٨. Regression.\n٩. قرار التسليم.';log('DECIDE','PASS','reference set selected')}S.output=out;$('roleOut').textContent=out}
function bind(){if(S.role==='knowledge'){['kg','ks','kq'].forEach(id=>$(id).addEventListener($(id).tagName==='INPUT'?'input':'change',renderKnowledge));renderKnowledge()}else if(S.role==='ai'){$('api').value=key();$('save').onclick=()=>{saveKey($('api').value.trim());$('aist').textContent='تم حفظ المفتاح محليًا.'};$('ask').onclick=askAI}else if(S.role==='assurance')$('audit').onclick=audit;else $('drive').onclick=drive}
function render(){tabs();let h=S.role==='knowledge'?knowledgeView():S.role==='ai'?aiView():S.role==='assurance'?assuranceView():roleView();$('workspace').innerHTML=h;bind()}
async function boot(){try{let r=await fetch('./knowledge/competencies.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();if(!Array.isArray(d.records))throw Error('invalid records');S.records=d.records;S.coverage=Array.isArray(d.coverage)?d.coverage:[];log('BOOT','PASS',`loaded ${S.records.length} records`);render()}catch(e){S.records=[];S.coverage=[];log('BOOT','FAIL',e.message);render();$('workspace').innerHTML=`<section class="panel"><div class="status danger">تعذر تحميل قاعدة المعرفة: ${esc(e.message)}</div></section>`}}if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});boot();</script></body></html>
