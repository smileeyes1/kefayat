<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17324d">
<link rel="manifest" href="./manifest.webmanifest">
<title>كفايات Ω — نظام التشغيل التعليمي الفلسطيني</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#172033;background:#f4f7fb;line-height:1.65}*{box-sizing:border-box}body{margin:0}.app{max-width:1180px;margin:auto;padding:12px}.top,.panel{background:#fff;border:1px solid #dbe3ec;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 6px 22px #1522380b}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top h1{margin:0}.muted{color:#64748b}.badges,.actions,.nav{display:flex;gap:7px;flex-wrap:wrap}.badge{padding:5px 9px;border-radius:999px;background:#eef2f7;font-size:.8rem;font-weight:800}.nav button,.actions button,button{font:inherit;border:1px solid #cbd5e1;border-radius:11px;padding:10px 12px;background:#fff;cursor:pointer;font-weight:800}.nav button.active,button.primary{background:#17324d;color:#fff;border-color:#17324d}button.good{background:#0f766e;color:#fff;border-color:#0f766e}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px;font-weight:800}.field input,.field select,.field textarea{font:inherit;border:1px solid #cbd5e1;border-radius:11px;padding:10px 12px;background:#fff;min-width:0}.field textarea{min-height:105px;resize:vertical}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.card{padding:12px;border:1px solid #e2e8f0;border-radius:13px;background:#fafcff}.card b{display:block;font-size:1.25rem}.status,.output,.contract,.refs{padding:12px;border-radius:13px;border:1px solid #dbe3ec;background:#fafcff;white-space:pre-wrap}.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.warn{background:#fff8e8;border-color:#f2d79a}.danger{background:#fff1f2;border-color:#fecdd3;color:#9f1239}.trace{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.node{padding:8px;border:1px solid #dbe3ec;border-radius:10px;text-align:center;font-weight:800;background:#fafbfc;font-size:.88rem}.node.active{border-color:#0f766e;background:#ecfdf5}.layout{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.5fr);gap:12px}.list{max-height:460px;overflow:auto;border:1px solid #e2e8f0;border-radius:12px}.item{display:block;width:100%;text-align:right;border:0;border-bottom:1px solid #edf2f7;border-radius:0;padding:10px;background:#fff}.item:hover{background:#f8fafc}.code{direction:ltr;text-align:left;font-family:ui-monospace,monospace;background:#0f172a;color:#e2e8f0;padding:10px;border-radius:10px;overflow:auto}.artifact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.artifact-preview{width:100%;height:auto;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.download-link{display:inline-block;text-decoration:none;background:#0f766e;color:#fff;font-weight:800;padding:10px 14px;border-radius:10px}.footer{text-align:center;color:#64748b;font-size:.8rem;padding:8px}@media(max-width:850px){.grid,.cards{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.trace{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.cards,.trace,.artifact-grid{grid-template-columns:1fr}.app{padding:7px}}
@media print{.nav,.actions,.no-print{display:none!important}.app{max-width:none}.panel,.top{box-shadow:none;border:0}.print-artifact{font-size:16pt}}
</style>
</head>
<body>
<main class="app">
<header class="top">
<div><h1>كفايات Ω</h1><div class="muted">نظام تشغيل تعليمي فلسطيني ذاتي القيادة: يفهم الغاية، يثبت العقد، ينفّذ، ويتحقق قبل الادعاء.</div></div>
<div class="badges"><span class="badge">Evidence-Governed</span><span class="badge">Local-First</span><span class="badge">WISDOM</span><span class="badge">Intent Contract v1</span></div>
</header>
<section class="panel no-print"><nav class="nav" id="nav">
<button data-view="mission" class="active">المهمة</button><button data-view="knowledge">المعرفة</button><button data-view="assurance">الضمان Ω</button><button data-view="ai">GEM AI</button><button data-view="ledger">سجل التنفيذ</button>
</nav></section>
<section id="workspace"></section>
<footer class="footer">الغاية قبل التنفيذ · العقد قبل التوليد · الدليل قبل الادعاء · ما يراه ويستخدمه الإنسان هو معيار القبول.</footer>
</main>
<script src="./intent/intent-engine.js"></script>
<script src="./artifact/pdf-artifact-engine.js"></script>
<script>
'use strict';
const S={records:[],coverage:[],view:'mission',role:'teacher',last:null,ledger:[]};
const $=id=>document.getElementById(id), ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const subjects={arabic:'اللغة العربية',mathematics:'الرياضيات',islamic_education:'التربية الإسلامية',nurturing:'التنشئة/الوطنية والحياتية'};
const KEY='kefayat.gemini.apiKey',USAGE='kefayat.gemini.dailyUsage',MODEL='gemini-2.5-flash-lite';
function log(step,state,note=''){S.ledger.push({time:new Date().toISOString(),step,state,note});if(S.ledger.length>100)S.ledger.shift();localStorage.setItem('kefayat.intent.ledger',JSON.stringify(S.ledger))}
function usage(){try{const x=JSON.parse(localStorage.getItem(USAGE)||'{}');return x.date===new Date().toISOString().slice(0,10)?Number(x.count||0):0}catch(_){return 0}}
function bump(){localStorage.setItem(USAGE,JSON.stringify({date:new Date().toISOString().slice(0,10),count:usage()+1}))}
function apiKey(){return localStorage.getItem(KEY)||''}
function saveKey(v){v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}
function inferMission(text,grade,subject){return KefayatIntent.compileContract({text,grade,subject},S.records,{role:S.role,education_system:'palestinian'})}
function retrieveMission(m){return KefayatIntent.retrieveEvidence(m,S.records)}
function wisdomGate(m,refs){return KefayatIntent.contractGate(m,refs)}
function markTrace(n){document.querySelectorAll('.node').forEach((x,i)=>x.classList.toggle('active',i<n))}
function stats(){return `<div class="cards"><div class="card"><b>${ar(S.records.length)}</b>سجل كفاية</div><div class="card"><b>${ar(S.coverage.length)}</b>تغطية مصدر</div><div class="card"><b>١–٤</b>الصفوف</div><div class="card"><b>Ω</b>Acceptance Oracle</div></div>`}
function missionView(){return `<section class="panel"><h2>الغاية → العقد → التحقيق</h2><p class="muted">اكتب ما تريد بالصيغة الطبيعية. لا حاجة لتشغيل المنظومة يدويًا. سيُفصل المتطلب الصلب عن التفضيل، ويُمنع الافتراض غير المثبت.</p>${stats()}</section>
<section class="panel no-print"><div class="grid"><label class="field"><span>المادة — اختياري</span><select id="subject"><option value="all">استنتاج من الغاية</option><option value="mathematics">الرياضيات</option><option value="arabic">العربية</option><option value="islamic_education">التربية الإسلامية</option><option value="nurturing">التنشئة</option></select></label><label class="field"><span>الصف — اختياري</span><select id="grade"><option value="all">استنتاج بالدليل</option><option value="1">الأول</option><option value="2">الثاني</option><option value="3">الثالث</option><option value="4">الرابع</option></select></label><label class="field"><span>الدور</span><select id="role"><option value="teacher">المعلم</option><option value="student">الطالب</option><option value="supervisor">المشرف</option><option value="principal">المدير</option><option value="family">الأسرة</option></select></label></div><label class="field" style="margin-top:10px"><span>الغاية</span><textarea id="goal" placeholder="مثال: أنشئ درس الجمع ضمن ١٠ كملف PDF"></textarea></label><div class="actions" style="margin-top:10px"><button id="drive" class="primary">حقق الغاية</button><button id="example">تجربة المثال الحاكم</button><button id="print" onclick="window.print()">طباعة العرض</button><button id="clear">مسح</button></div></section>
<section class="panel"><h3>القيادة الذاتية</h3><div class="trace">${['فهم النية','تثبيت العقد','استرجاع الدليل','خطة التنفيذ','WISDOM','البناء','التحقق','User-Eye','Regression','Acceptance'].map(x=>`<div class="node">${x}</div>`).join('')}</div></section>
<section class="panel"><h3>Intent Contract</h3><div id="contract" class="contract">لم تُنفذ مهمة بعد.</div></section>
<section class="panel"><h3>النتيجة</h3><div id="result" class="output print-artifact">لا ادعاء بالتحقيق قبل المرور عبر Acceptance Oracle.</div><div id="artifact" style="margin-top:12px"></div></section>
<section class="panel"><h3>الدليل المسترجع</h3><div id="refs" class="refs">—</div></section>`}
function knowledgeView(){return `<section class="panel"><h2>المعرفة</h2>${stats()}<div class="grid" style="margin-top:12px"><label class="field"><span>بحث</span><input id="q" placeholder="جمع، قراءة، صلاة..."></label><label class="field"><span>المادة</span><select id="ks"><option value="all">الكل</option>${Object.entries(subjects).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label class="field"><span>الصف</span><select id="kg"><option value="all">الكل</option><option value="1">١</option><option value="2">٢</option><option value="3">٣</option><option value="4">٤</option></select></label></div><div id="klist" class="list" style="margin-top:12px"></div></section>`}
function assuranceView(){return `<section class="panel"><h2>الضمان Ω</h2><div class="status ok">Intent Contract Engine: مفعّل · Fulfillment Gate: مفعّل · PDF Artifact Engine: مفعّل · Evidence posture: claim-scoped</div><p>قاعدة الرياضيات P0: الهدف لعين الطالب <b>٤ + ٣ = □</b>، والطلب التنفيذي الحاكم للمحرك <b>□ = ٣ + ٤</b>. هوية الحدود لا تُبدل. RTL/BiDi ليس سلطة المعنى.</p><p>Cross-Domain contamination = NO-GO. GENERATED ≠ FULFILLED. طلب PDF يولّد ملف PDF فعليًا عندما يكون العقد محسومًا، ثم تبقى أي بوابة لم تُثبت موسومة NOT_PROVEN بدل الادعاء.</p><div class="code">USER INTENT → INTENT CONTRACT → EVIDENCE → PLAN → REAL ARTIFACT → VERIFY → REPAIR → REGRESSION → ACCEPTANCE → DELIVERY</div></section>`}
function aiView(){return `<section class="panel"><h2>GEM AI — Free-First</h2><p class="muted">المحلي هو طبقة السلطة. Gemini اختياري لتوسيع التوليد بعد تثبيت Intent Contract؛ لا يسمح له بتغيير العقد.</p><div class="grid"><label class="field"><span>مفتاح Gemini</span><input id="api" type="password" placeholder="اختياري"></label><label class="field"><span>النمط</span><select id="mode"><option value="auto">تلقائي</option><option value="local">محلي فقط</option><option value="cloud">Gemini</option></select></label><div class="status">الاستخدام اليوم: ${ar(usage())}</div></div><label class="field" style="margin-top:10px"><span>المهمة</span><textarea id="prompt" placeholder="اكتب الغاية..."></textarea></label><div class="actions" style="margin-top:10px"><button id="ask" class="good">نفّذ وفق العقد</button><button id="savekey">حفظ المفتاح محليًا</button></div><div id="aiout" class="output">جاهز.</div></section>`}
function ledgerView(){const rows=S.ledger.slice().reverse().map(x=>`<div class="item"><b>${esc(x.step)} — ${esc(x.state)}</b><small>${esc(x.time)} · ${esc(x.note)}</small></div>`).join('');return `<section class="panel"><h2>سجل التنفيذ</h2><div class="list">${rows||'<div class="item">لا أحداث بعد.</div>'}</div></section>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===S.view));$('workspace').innerHTML=S.view==='mission'?missionView():S.view==='knowledge'?knowledgeView():S.view==='assurance'?assuranceView():S.view==='ai'?aiView():ledgerView();bind()}
function renderKnowledge(){const q=KefayatIntent.normalizeArabic($('q')?.value||''),s=$('ks')?.value||'all',g=$('kg')?.value||'all';const list=S.records.filter(r=>(s==='all'||r.subject===s)&&(g==='all'||String(r.grade)===g)&&(!q||KefayatIntent.normalizeArabic([r.id,r.main_competency,r.sub_competency,r.criterion,r.source_text].join(' ')).includes(q))).slice(0,80);$('klist').innerHTML=list.map(r=>`<button class="item"><b>${esc(r.id)} · الصف ${ar(r.grade)} · ${esc(subjects[r.subject]||r.subject)}</b><small>${esc(r.main_competency||r.sub_competency||r.criterion||'')}</small><small>provenance: ${esc(r.provenance?.status||'NOT PROVEN')}</small><small>source_text: ${esc((r.source_text||'').slice(0,180))}</small></button>`).join('')||'<div class="item">لا نتائج.</div>'}
function contractSummary(c,gate,plan){return `القرار الأولي: ${gate.pass?'READY FOR EXECUTION':'NOT READY'}\nالغاية: ${c.goal}\nالسياق: ${c.context_scope||'غير محدد'}\nالمجال: ${subjects[c.subject]||c.subject||'غير محسوم'}\nالصف: ${c.grade?ar(c.grade):'غير محسوم'} (${c.grade_resolution.source})\nالثقة: ${Math.round((c.confidence||0)*100)}%\nنوع المهمة: ${c.task_type}\nنوع التسليم: ${c.artifact_type}\nالمتطلبات الصلبة: ${c.hard_requirements.join('، ')||'—'}\nالتفضيلات: ${c.preferences.join('، ')||'—'}\nالثوابت المحمية: ${c.protected_invariants.join('، ')||'—'}\nغير المحسوم: ${c.unresolved.join('، ')||'لا شيء'}\nمعايير القبول: ${c.acceptance_criteria.join('، ')}\nالخطة: ${plan.steps.join(' → ')}`}
function showRefs(refs){$('refs').innerHTML=refs.map(r=>`<div class="item"><b>${esc(r.id)} · ${esc(subjects[r.subject]||r.subject)} · الصف ${ar(r.grade)}</b><small>${esc(r.criterion||r.main_competency||'')}</small><small>provenance: ${esc(r.provenance?.status||'NOT PROVEN')}</small><small>source_text: ${esc((r.source_text||'').slice(0,220))}</small></div>`).join('')||'لا يوجد مرجع مطابق.'}
function showArtifact(a){if(!a)return;$('artifact').innerHTML='';const url=URL.createObjectURL(a.blob);S.last.artifactUrl=url;const head=document.createElement('div');head.className='actions';const link=document.createElement('a');link.className='download-link';link.href=url;link.download=a.filename;link.textContent='تحميل PDF الفعلي';head.appendChild(link);const meta=document.createElement('span');meta.className='badge';meta.textContent=`${a.filename} · ${ar(a.evidence.page_count)} صفحات · ${ar(a.bytes.length)} بايت`;head.appendChild(meta);$('artifact').appendChild(head);const grid=document.createElement('div');grid.className='artifact-grid';grid.style.marginTop='10px';a.previewCanvases.forEach((c,i)=>{const img=document.createElement('img');img.className='artifact-preview';img.alt=`معاينة الصفحة ${ar(i+1)}`;img.src=c.toDataURL('image/jpeg',.82);grid.appendChild(img)});$('artifact').appendChild(grid)}
async function drive(){const goal=$('goal').value.trim();S.role=$('role').value;log('UNDERSTAND','START',goal);markTrace(1);const c=inferMission(goal,$('grade').value,$('subject').value);markTrace(2);const refs=retrieveMission(c);markTrace(3);const plan=KefayatIntent.buildPlan(c,refs);markTrace(4);const gate=wisdomGate(c,refs);markTrace(5);const draft=KefayatIntent.localDraft(c,refs);S.last={contract:c,refs,plan,gate,draft,artifact:null,artifactUrl:null};$('contract').textContent=contractSummary(c,gate,plan);$('contract').className='contract '+(gate.pass?'ok':'warn');$('result').textContent=draft.text;showRefs(refs);log('INTENT_CONTRACT',gate.pass?'PASS':'NO-GO',gate.reasons.join('; ')||`${c.subject}; grade=${c.grade}; artifact=${c.artifact_type}`);
 let evidence={};
 if(gate.pass&&c.artifact_type==='pdf'){
   try{markTrace(6);$('result').textContent+='\n\nجارٍ إنشاء PDF فعلي محليًا…';const artifact=await KefayatArtifact.buildLessonPdf(c,refs);S.last.artifact=artifact;evidence=artifact.evidence;showArtifact(artifact);KefayatArtifact.downloadArtifact(artifact);log('REAL_ARTIFACT','CREATED',`${artifact.filename}; bytes=${artifact.bytes.length}`);markTrace(8)}catch(e){log('REAL_ARTIFACT','NO-GO',e.message);$('result').textContent+=`\n\nفشل إنشاء PDF: ${e.message}`;}
 }
 const oracle=KefayatIntent.acceptanceOracle(c,refs,evidence);$('result').textContent+=`\n\nAcceptance Oracle: ${oracle.decision}\nغير المثبت: ${oracle.failed.join('، ')||'—'}\nنطاق الادعاء: ${oracle.claim_scope}`;markTrace(oracle.decision==='PASS'?10:(gate.pass?9:5));log('ACCEPTANCE',oracle.decision,oracle.failed.join('; '));}
async function askGemini(){const p=$('prompt').value.trim();if(!p)return;const c=inferMission(p,'all','all'),refs=retrieveMission(c),gate=wisdomGate(c,refs),draft=KefayatIntent.localDraft(c,refs);if($('mode').value==='local'||(!apiKey()&&$('mode').value==='auto')){$('aiout').textContent=draft.text;return}const k=$('api').value.trim()||apiKey();if(!k){$('aiout').textContent=draft.text+'\n\nلم يوجد مفتاح؛ تم التنفيذ المحلي دون ادعاء سحابي.';return}saveKey(k);const payload={intent_contract:c,evidence:refs.slice(0,5),gate,rule:'Do not change the frozen intent contract. Return only content that satisfies it. If an acceptance criterion cannot be evidenced, label it NOT PROVEN.'};try{$('aiout').textContent='جارٍ التنفيذ ضمن العقد...';const body={contents:[{role:'user',parts:[{text:'KEFAYAT Ω Intent Contract is authoritative. WISDOM and Cross-Domain guards are mandatory. '+JSON.stringify(payload)+'\nUSER TASK: '+p}]}],generationConfig:{temperature:.2,maxOutputTokens:1600}};const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+':generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await res.json();if(!res.ok)throw Error(d?.error?.message||('HTTP '+res.status));bump();$('aiout').textContent=d?.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('')||'لم يعد النموذج نصًا.';log('AI','PASS','response governed by frozen contract')}catch(e){$('aiout').textContent=draft.text+'\n\nفشل المسار السحابي: '+e.message+'\nتم الحفاظ على العقد والتحول للمحلي.';log('AI','FALLBACK',e.message)}}
function bind(){if(S.view==='mission'){$('drive').onclick=drive;$('example').onclick=()=>{$('goal').value='أنشئ درس الجمع ضمن ١٠ كملف PDF';$('subject').value='all';$('grade').value='all';drive()};$('clear').onclick=()=>{if(S.last?.artifactUrl)URL.revokeObjectURL(S.last.artifactUrl);S.last=null;$('goal').value='';$('contract').textContent='لم تُنفذ مهمة بعد.';$('result').textContent='لا ادعاء بالتحقيق قبل المرور عبر Acceptance Oracle.';$('refs').textContent='—';$('artifact').textContent=''}}else if(S.view==='knowledge'){['q','ks','kg'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',renderKnowledge));renderKnowledge()}else if(S.view==='ai'){$('api').value=apiKey();$('savekey').onclick=()=>saveKey($('api').value.trim());$('ask').onclick=askGemini}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;render()});
try{S.ledger=JSON.parse(localStorage.getItem('kefayat.intent.ledger')||'[]')}catch(_){S.ledger=[]}
async function boot(){try{const r=await fetch('./knowledge/competencies.json',{cache:'no-cache'}),data=await r.json();if(!Array.isArray(data.records)||!Array.isArray(data.coverage))throw Error('invalid knowledge shape');S.records=data.records;S.coverage=data.coverage;log('KNOWLEDGE','PASS',`${S.records.length} records`)}catch(e){log('KNOWLEDGE','NOT_PROVEN',e.message)}render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(e=>log('SERVICE_WORKER','NOT_PROVEN',e.message))}
boot();
</script>
</body>
</html>
