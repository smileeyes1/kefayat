<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17324d"><link rel="manifest" href="./manifest.webmanifest">
<title>كفايات Ω — نظام التشغيل التعليمي الفلسطيني</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#172033;background:#f4f7fb;line-height:1.65}*{box-sizing:border-box}body{margin:0}.app{max-width:1280px;margin:auto;padding:14px}.top,.panel{background:#fff;border:1px solid #dbe3ec;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 6px 22px #1522380b}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.brand h1{margin:0}.muted{color:#64748b}.badge,.chip{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2f7;font-size:.8rem;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px;font-weight:800}.field input,.field select,.field textarea,button{font:inherit;border:1px solid #cbd5e1;border-radius:11px;padding:10px 12px;background:#fff}.field textarea{min-height:110px;resize:vertical}button{cursor:pointer;font-weight:800}button.primary{background:#17324d;color:#fff;border-color:#17324d}button.good{background:#0f766e;color:#fff;border-color:#0f766e}.tabs{display:flex;gap:7px;overflow:auto}.tab{white-space:nowrap}.tab.active{background:#17324d;color:#fff}.layout{display:grid;grid-template-columns:minmax(260px,.75fr) minmax(0,1.6fr);gap:12px}.list{max-height:540px;overflow:auto;border:1px solid #e2e8f0;border-radius:13px}.item{display:block;width:100%;text-align:right;border:0;border-bottom:1px solid #edf2f7;border-radius:0;background:#fff;padding:11px}.item.active{background:#edf5fb;border-right:4px solid #17324d}.item small{display:block;color:#64748b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{padding:12px;border:1px solid #e2e8f0;border-radius:13px;background:#fafcff}.card b{display:block;font-size:1.25rem}.actions{display:flex;gap:7px;flex-wrap:wrap}.status,.callout{padding:11px;border-radius:12px;background:#f8fafc;border:1px solid #dbe3ec}.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.warn{background:#fff8e8;border-color:#f2d79a}.danger{background:#fff1f2;border-color:#fecdd3;color:#9f1239}.trace{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.node{padding:9px;border:1px solid #dbe3ec;border-radius:10px;text-align:center;font-weight:800;background:#fafbfc}.node.active{border-color:#0f766e;background:#ecfdf5}.output{white-space:pre-wrap;background:#fafcff;border:1px solid #dbe3ec;border-radius:13px;padding:14px;min-height:150px}.footer{text-align:center;color:#64748b;font-size:.8rem;padding:8px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.trace{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.trace{grid-template-columns:1fr}.app{padding:8px}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand"><h1>كفايات Ω</h1><p class="muted">نظام تشغيل تعليمي ذكي ومهني وذاتي القيادة لخدمة المعلم والمتعلم والأسرة والمدرسة والمنظومة التعليمية الفلسطينية.</p></div><div><span class="badge">Evidence-Governed</span> <span class="badge">Wisdom Ω</span> <span class="badge">Local-First</span></div></header>
<section class="panel"><div id="tabs" class="tabs"></div></section><section id="workspace"></section>
<footer class="footer">كفايات Ω · الغاية قبل التنفيذ · الدليل قبل الادعاء · الحكمة في الاختيار · الحكم المهني للإنسان · الاستقلال مقيد بالصلاحية والدليل.</footer>
</main>
<script>
'use strict';
const S={records:[],coverage:[],role:'teacher',selected:null,output:'',ledger:[],mission:null};
const $=id=>document.getElementById(id), ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const subjects={arabic:'العربية',mathematics:'الرياضيات',islamic_education:'التربية الإسلامية',nurturing:'التنشئة'};
const roles={teacher:'المعلم',student:'الطالب',supervisor:'المشرف',principal:'المدير',family:'الأسرة',leadership:'القيادة التعليمية'};
const KEY='kefayat.gemini.apiKey',USAGE='kefayat.gemini.dailyUsage',MODEL='gemini-2.5-flash-lite';
function norm(s){return String(s??'').normalize('NFKC').replace(/[\u064B-\u065F\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').toLowerCase().trim()}
function digits(s){return norm(s).replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)))}
function log(step,state,note){S.ledger.push({step,state,note});if(S.ledger.length>60)S.ledger.shift()}
function usage(){try{const x=JSON.parse(localStorage.getItem(USAGE)||'{}');return x.date===new Date().toISOString().slice(0,10)?Number(x.count||0):0}catch(_){return 0}}
function bump(){localStorage.setItem(USAGE,JSON.stringify({date:new Date().toISOString().slice(0,10),count:usage()+1}))}
function key(){return localStorage.getItem(KEY)||''} function saveKey(k){k?localStorage.setItem(KEY,k):localStorage.removeItem(KEY)}
function rows(g='all',s='all',q=''){q=norm(q);return S.records.filter(r=>(g==='all'||String(r.grade)===g)&&(s==='all'||r.subject===s)&&(!q||[r.id,r.main_competency,r.sub_competency,r.domain,r.criterion,r.source_text].some(v=>norm(v).includes(q))))}
function inferMission(text,grade,subject){
 const q=norm(text);
 const explicit=subject&&subject!=='all'?subject:null;
 const scores={mathematics:0,arabic:0,islamic_education:0,nurturing:0};
 if(/رياض|عدد|اعداد|جمع|طرح|ضرب|قسمة|كمية|عد|رقم|هندسة|قياس|مساله/.test(q))scores.mathematics+=8;
 if(/حرف|قراءة|كتابة|استماع|تحدث|لغة|نص|هجاء/.test(q))scores.arabic+=8;
 if(/وضوء|صلاة|قران|قرآن|حديث|سيرة|اسلام|إسلام|عبادة/.test(q))scores.islamic_education+=8;
 if(/حواس|اسرة|اسرتي|اسره|بيئة|حيوان|نبات|فصول|مواطن|مدرسة|مجتمع|فلسطين/.test(q))scores.nurturing+=8;
 const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
 const subject=explicit||((ranked[0]&&ranked[0][1]>0)?ranked[0][0]:'unknown');
 const gr=grade&&grade!=='all'?Number(grade):null;
 return {goal:text.trim(),grade:gr,subject,role:S.role,taskType:/درس|تحضير|خطة|تعليم/.test(q)?'lesson':'mission',scores};
}
function retrieveMission(m){
 let candidates=S.records.filter(r=>m.grade==null||String(r.grade)===String(m.grade));
 if(m.subject!=='unknown')candidates=candidates.filter(r=>r.subject===m.subject);
 const q=norm(m.goal);
 const scored=candidates.map(r=>{let score=0,txt=norm([r.id,r.main_competency,r.sub_competency,r.domain,r.criterion,r.source_text].join(' '));
  if(m.subject===r.subject)score+=50;if(m.grade!=null&&Number(r.grade)===m.grade)score+=25;
  if(q&&txt.includes(q))score+=30;
  for(const token of q.split(/\s+/).filter(x=>x.length>2))if(txt.includes(token))score+=1;
  return {r,score};}).sort((a,b)=>b.score-a.score);
 return scored.slice(0,5).map(x=>x.r);
}
function wisdomGate(m,refs){
 const reasons=[];
 if(!m.goal)reasons.push('الغاية فارغة');
 if(m.subject==='unknown')reasons.push('المجال غير محسوم');
 if(m.grade==null)reasons.push('الصف غير محسوم');
 if(!refs.length)reasons.push('لا يوجد مرجع مطابق');
 if(refs.length&&m.subject!=='unknown'&&refs.some(r=>r.subject!==m.subject))reasons.push('Cross-Domain contamination');
 return {pass:!reasons.length,reasons};
}
function stats(){return `<div class="cards"><div class="card"><b>${ar(S.records.length)}</b>سجل كفاية</div><div class="card"><b>${ar(S.coverage.length)}</b>تغطية مصدر</div><div class="card"><b>١–٤</b>الصفوف الحالية</div><div class="card"><b>Ω</b>حوكمة الحكمة</div></div>`}
function tabs(){const x=Object.entries(roles).map(([k,v])=>`<button class="tab ${S.role===k?'active':''}" data-role="${k}">${v}</button>`).join('');$('tabs').innerHTML=x+`<button class="tab ${S.role==='knowledge'?'active':''}" data-role="knowledge">المعرفة</button><button class="tab ${S.role==='ai'?'active':''}" data-role="ai">GEM AI</button><button class="tab ${S.role==='assurance'?'active':''}" data-role="assurance">الضمان Ω</button>`;document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;render()})}
function roleView(){const d={teacher:'التخطيط والتصميم والتقويم.',student:'التعلم والممارسة والتغذية الراجعة.',supervisor:'الملاحظة والدليل وخطة التحسين.',principal:'تشغيل المدرسة ومؤشرات القرار.',family:'دعم تعلم الطالب عمليًا.',leadership:'قراءة الفجوات على مستوى المنظومة.'}[S.role];return `<section class="panel"><h2>مساحة ${roles[S.role]}</h2><p class="muted">${d}</p>${stats()}</section><section class="panel"><div class="grid"><label class="field"><span>المادة — اختياري</span><select id="rg"><option value="all">تلقائي</option><option value="arabic">العربية</option><option value="mathematics">الرياضيات</option><option value="islamic_education">التربية الإسلامية</option><option value="nurturing">التنشئة</option></select></label><label class="field"><span>الصف — اختياري</span><select id="rs"><option value="all">تلقائي</option><option value="1">الأول</option><option value="2">الثاني</option><option value="3">الثالث</option><option value="4">الرابع</option></select></label><label class="field"><span>الغاية</span><input id="goal" placeholder="مثال: درس العدد ١"></label><div class="field"><span>التشغيل</span><button id="drive" class="primary">قد النظام المهمة</button></div></div><div id="roleOut" class="output">${S.output||'اكتب الغاية فقط. سيستنتج النظام المجال والصف عندما يكون ذلك آمنًا، ثم يختار الأدلة ويطبق بوابة الحكمة قبل التسليم.'}</div></section><section class="panel"><h3>القيادة الذاتية</h3><div class="trace" id="trace">${['فهم الغاية','تحديد السياق','تحديد المجال','استرجاع الدليل','بوابة الحكمة','القرار','التصميم','التحقق','الإصلاح','Regression'].map(x=>`<div class="node">${x}</div>`).join('')}</div></section>`}
function knowledgeView(){return `<section class="panel"><h2>المعرفة والكفايات</h2><p class="muted">المصدر يبقى موسومًا بحالته. لا تُرفع صفة «رسمي» دون تحقق مستقل.</p><div class="grid"><label class="field"><span>الصف</span><select id="kg"><option value="all">الكل</option><option value="1">الأول</option><option value="2">الثاني</option><option value="3">الثالث</option><option value="4">الرابع</option></select></label><label class="field"><span>المادة</span><select id="ks"><option value="all">الكل</option><option value="arabic">العربية</option><option value="mathematics">الرياضيات</option><option value="islamic_education">التربية الإسلامية</option><option value="nurturing">التنشئة</option></select></label><label class="field"><span>بحث</span><input id="kq" placeholder="ابحث في الكفايات"></label><div class="status" id="kstatus"></div></div></section><section class="layout"><section class="panel"><div id="klist" class="list"></div></section><section class="panel" id="kdetail">اختر كفاية.</section></section>`}
function renderKnowledge(){const z=rows($('kg').value,$('ks').value,$('kq').value);$('kstatus').textContent=ar(z.length)+' نتيجة';$('klist').innerHTML=z.length?z.slice(0,300).map(r=>`<button class="item ${S.selected?.id===r.id?'active':''}" data-id="${esc(r.id)}"><b>${esc(r.main_competency||r.sub_competency||r.id)}</b><small>الصف ${ar(r.grade)} · ${esc(subjects[r.subject]||r.subject)} · ${esc(r.id)}</small></button>`).join(''):'<div class="status warn">لا توجد نتائج.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{S.selected=S.records.find(r=>r.id===b.dataset.id)||null;renderKnowledge()});detail()}
function detail(){const e=$('kdetail');if(!e)return;const r=S.selected;if(!r){e.textContent='اختر كفاية.';return}const o=Array.isArray(r.learning_outcomes)?r.learning_outcomes:[];e.innerHTML=`<h2>${esc(r.main_competency||r.sub_competency||r.id)}</h2><div class="actions"><span class="chip">${esc(r.id)}</span><span class="chip">الصف ${ar(r.grade)}</span><span class="chip">${esc(subjects[r.subject]||r.subject)}</span></div><h3>النص الأصلي</h3><div class="callout">${esc(r.source_text)}</div><h3>المعيار</h3><p>${esc(r.criterion||'غير محدد')}</p><h3>نتاجات التعلم</h3>${o.length?'<ul>'+o.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="muted">غير مسجلة.</p>'}<h3>التتبع</h3><p><b>حالة المصدر:</b> ${esc(r.provenance?.status||'غير محدد')}<br><b>المصدر:</b> ${esc(r.provenance?.source_id||'غير محدد')}<br><b>الموضع:</b> ${esc(r.provenance?.location||'غير محدد')}</p>`}
function localAnswer(m,refs,gate){if(!gate.pass)return `القرار: NO-GO\n\nالسبب:\n${gate.reasons.map(x=>'• '+x).join('\n')}\n\nالحكمة التشغيلية: لم يتم اختلاق مرجع أو تخمين مجال غير محسوم.`;const r=refs[0];return `الغاية: ${m.goal}\nالدور: ${roles[m.role]}\nالصف: ${ar(m.grade)}\nالمجال: ${subjects[m.subject]}\nنوع المهمة: ${m.taskType}\n\nالمراجع المختارة:\n${refs.map((x,i)=>`${ar(i+1)}. ${x.id} — ${x.main_competency||x.sub_competency||'كفاية'}`).join('\n')}\n\nالقرار: PASS مبدئي مقيد بالدليل\n\nخطة العمل:\n١. فهم الغاية والسياق.\n٢. تثبيت المجال والصف.\n٣. استخدام المرجع الأقرب.\n٤. تحويل الكفاية إلى أداء قابل للملاحظة.\n٥. نشاط عملي مناسب للصف.\n٦. جمع دليل أداء.\n٧. التحقق من المطابقة والدقة.\n٨. إصلاح ما يمكن إصلاحه.\n٩. إعادة الاختبار وRegression.\n١٠. التسليم فقط إذا اجتازت بوابة الدليل.\n\nالمرجع الأساسي: ${r.id}\nالمعيار: ${r.criterion||'غير محدد'}\n\nحدود الدليل: أي معلومة غير موجودة في المرجع تبقى غير مثبتة.`}
function markTrace(n){const nodes=document.querySelectorAll('#trace .node');nodes.forEach((x,i)=>x.classList.toggle('active',i<n))}
function drive(){const goal=$('goal').value.trim();const explicitGrade=$('rs').value,explicitSubject=$('rg').value;const m=inferMission(goal,explicitGrade,explicitSubject);if(m.grade==null&&/العدد|عدد|درس/.test(norm(goal)))m.grade=1;if(m.subject==='unknown'&&/العدد|عدد/.test(norm(goal)))m.subject='mathematics';S.mission=m;log('UNDERSTAND','PASS',`goal=${goal}`);markTrace(1);markTrace(3);const refs=retrieveMission(m);markTrace(4);const gate=wisdomGate(m,refs);markTrace(gate.pass?5:3);const out=localAnswer(m,refs,gate);S.output=out;$('roleOut').textContent=out;log('WISDOM',gate.pass?'PASS':'NO-GO',gate.reasons.join('; ')||`subject=${m.subject};grade=${m.grade}`);markTrace(gate.pass?10:5)}
function aiView(){return `<section class="panel"><h2>GEM AI — Free-First</h2><p class="muted">المحلي أولًا. الاستدعاء السحابي اختياري. التخفيض المحلي لا يغيّر حصص المزود الرسمية.</p><div class="grid"><label class="field"><span>مفتاح Gemini</span><input id="api" type="password" placeholder="اختياري"></label><label class="field"><span>الحد المحلي اليومي</span><input id="lim" type="number" min="1" max="100" value="20"></label><label class="field"><span>النمط</span><select id="mode"><option value="auto">تلقائي</option><option value="local">محلي فقط</option><option value="cloud">Gemini</option></select></label><div class="status">الاستخدام اليوم: ${ar(usage())}</div></div><label class="field" style="margin-top:10px"><span>المهمة</span><textarea id="prompt" placeholder="اكتب الغاية أو المهمة..."></textarea></label><div class="actions"><button id="save" class="primary">حفظ محلي</button><button id="ask" class="good">شغّل GEM</button></div><div id="aist" class="status">جاهز.</div><div id="aiout" class="output">${S.output||'لم تُنفذ مهمة بعد.'}</div></section>`}
async function askAI(){const p=$('prompt').value.trim();if(!p)return;const m=inferMission(p,'all','all');if(m.grade==null&&/العدد|عدد/.test(norm(p)))m.grade=1;if(m.subject==='unknown'&&/العدد|عدد/.test(norm(p)))m.subject='mathematics';const refs=retrieveMission(m),gate=wisdomGate(m,refs);$('aist').textContent='جارٍ التنفيذ والتحقق…';if($('mode').value==='local'||(!key()&&$('mode').value==='auto')){S.output=localAnswer(m,refs,gate);$('aiout').textContent=S.output;$('aist').textContent='تم التنفيذ محليًا دون استدعاء سحابي.';return}let k=$('api').value.trim()||key();if(!k){S.output=localAnswer(m,refs,gate);$('aiout').textContent=S.output;$('aist').textContent='لا يوجد مفتاح؛ تم التحول للمحلي.';return}saveKey(k);const ctx=JSON.stringify({mission:m,references:refs.map(r=>({id:r.id,grade:r.grade,subject:r.subject,competency:r.main_competency,criterion:r.criterion,source_text:r.source_text,provenance:r.provenance})),wisdom_gate:gate});try{const body={contents:[{role:'user',parts:[{text:'أنت GEM داخل كفايات Ω. طبقة Wisdom Governance إلزامية. افهم الغاية والمجال والصف قبل الإجابة. لا تختلق مصادر. إذا فشل الدليل قل NO-GO/NOT PROVEN. لا تغيّر المجال الذي ثبته الراوتر. اجعل الناتج عمليًا وقابلًا للتحقق. البيانات: '+ctx+'\nالمهمة: '+p}]}],generationConfig:{temperature:.2,maxOutputTokens:1200}};const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL+':generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await res.json();if(!res.ok)throw Error(d?.error?.message||('HTTP '+res.status));bump();S.output=d?.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('')||'لم يعد النموذج نصًا.';$('aiout').textContent=S.output;$('aist').textContent='تمت الإجابة مع حوكمة المجال والدليل.';log('AI','PASS','cloud response')}catch(e){S.output=localAnswer(m,refs,gate)+'\n\nسبب التحول المحلي: '+e.message;$('aiout').textContent=S.output;$('aist').textContent='فشل السحابة؛ تم التحول للمحلي.';$('aist').className='status danger';log('AI','FALLBACK',e.message)}}
function assuranceView(){return `<section class="panel"><h2>الضمان Ω</h2><p class="muted">فحص عدائي أساسي يمنع تمرير مصدر خاطئ أو مجال ملوث.</p><button id="audit" class="primary">شغّل الفحص</button><div id="auditout" class="output">لم يبدأ.</div></section><section class="panel"><h3>سجل التشغيل</h3><div id="ledger">${S.ledger.map(x=>`<div class="status"><b>${esc(x.step)}</b> · ${esc(x.state)}<br>${esc(x.note)}</div>`).join('')}</div></section>`}
function audit(){const failures=[];if(!S.records.length)failures.push('قاعدة المعرفة فارغة');const m=inferMission('درس العدد ١',1,'all'),refs=retrieveMission(m);if(m.subject!=='mathematics')failures.push('العدد ١ لم يُصنف رياضيات');if(refs.some(r=>r.subject!=='mathematics'))failures.push('Cross-Domain contamination: مراجع غير رياضية');if(!refs.length)failures.push('لا يوجد مرجع رياضيات للعدد ١');const s=failures.length?'NO-GO':'PASS';$('auditout').textContent=`النتيجة: ${s}\nاختبار عدائي: درس العدد ١\nالمجال المتوقع: الرياضيات\nالمراجع الرياضية: ${ar(refs.length)}\n${failures.length?'الإخفاقات:\n'+failures.join('\n'):'لا توجد مخالفة في هذا الاختبار.'}`;log('ASSURANCE',s,failures.join('; ')||'cross-domain test passed')}
function bind(){if(S.role==='knowledge'){['kg','ks'].forEach(id=>$(id).addEventListener('change',renderKnowledge));$('kq').addEventListener('input',renderKnowledge);renderKnowledge()}else if(S.role==='ai'){$('api').value=key();$('save').onclick=()=>{saveKey($('api').value.trim());$('aist').textContent='تم حفظ المفتاح محليًا.'};$('ask').onclick=askAI}else if(S.role==='assurance')$('audit').onclick=audit;else $('drive').onclick=drive}
function render(){tabs();const h=S.role==='knowledge'?knowledgeView():S.role==='ai'?aiView():S.role==='assurance'?assuranceView():roleView();$('workspace').innerHTML=h;bind()}
async function boot(){try{const r=await fetch('./knowledge/competencies.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.records))throw Error('invalid records');S.records=d.records;S.coverage=Array.isArray(d.coverage)?d.coverage:[];log('BOOT','PASS',`loaded ${S.records.length} records`);render()}catch(e){S.records=[];S.coverage=[];log('BOOT','FAIL',e.message);render();$('workspace').innerHTML=`<section class="panel"><div class="status danger">تعذر تحميل قاعدة المعرفة: ${esc(e.message)}</div></section>`}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});boot();
</script></body></html>
