name: Deploy Kefayat Ω to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ai.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'knowledge/**'
      - 'GEM_KB_*.md'
      - 'raw_sources/**'
      - 'tools/**'
      - 'autonomy/**'
      - 'quality/**'
      - 'governance/**'
      - 'state/**'
      - 'baselines/**'
      - 'evidence/**'
      - 'operating/**'
      - 'GEM_KNOWLEDGE_PACK/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rebuild structured competency knowledge
        run: python tools/build_competencies.py

      - name: Run autonomous continuity runner
        run: python autonomy/continuity_runner.py

      - name: Run direct delivery contract
        run: python quality/test_delivery_contract.py

      - name: Run continuity and completion gate
        run: python quality/test_continuity_completion.py

      - name: Run autonomy regression
        run: python autonomy/test_controller.py

      - name: Run mission-plan regression
        run: python autonomy/test_mission_plan.py

      - name: Run intent-routing regression
        run: python autonomy/test_intent_routing.py

      - name: Run Wisdom Ω governance regression
        run: python autonomy/test_wisdom_governance.py

      - name: Run production contract regression
        run: python quality/test_production_contract.py

      - name: Run professional release gate
        run: python quality/test_professional_release.py

      - name: Verify release contract
        run: python quality/test_release_contract.py

      - name: Run hard GO gate
        run: python quality/test_go_gate.py

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Pre-deploy browser runtime/offline gate
        run: python quality/test_runtime_browser.py

      - name: Upload pre-deploy browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: kefayat-pages-predeploy-browser-evidence
          path: artifacts/runtime-browser
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Runtime smoke test
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Runtime URL: ${PAGE_URL}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}" -o /tmp/kefayat.html
          test -s /tmp/kefayat.html
          grep -q 'كفايات Ω' /tmp/kefayat.html
          grep -q 'inferMission' /tmp/kefayat.html
          grep -q 'WISDOM' /tmp/kefayat.html
          grep -q 'القيادة الذاتية' /tmp/kefayat.html
          echo 'LIVE RUNTIME SMOKE TEST: PASS'
