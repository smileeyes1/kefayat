name: Deploy Kefayat Ω to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ai.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'knowledge/**'
      - 'GEM_KB_*.md'
      - 'raw_sources/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild structured competency knowledge
        run: python tools/build_competencies.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
