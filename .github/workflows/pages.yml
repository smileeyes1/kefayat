name: Deploy Kefayat Ω to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ai.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'knowledge/**'
      - 'GEM_KB_*.md'
      - 'raw_sources/**'
      - 'tools/**'
      - 'autonomy/**'
      - 'quality/**'
      - 'governance/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rebuild structured competency knowledge
        run: python tools/build_competencies.py

      - name: Run autonomy regression
        run: python autonomy/test_controller.py

      - name: Run mission-plan regression
        run: python autonomy/test_mission_plan.py

      - name: Run intent-routing regression
        run: python autonomy/test_intent_routing.py

      - name: Run Wisdom Ω governance regression
        run: python autonomy/test_wisdom_governance.py

      - name: Verify release contract
        run: python quality/test_release_contract.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
