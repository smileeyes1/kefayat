name: Production Gate

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ai.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'knowledge/**'
      - 'tools/**'
      - 'android/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild structured knowledge
        run: python tools/build_competencies.py
      - name: Deterministic production smoke
        run: python tools/production_smoke.py

  android-release-build:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build structured competency knowledge
        run: python tools/build_competencies.py
      - name: Stage production assets
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/knowledge
          cp index.html ai.html sw.js manifest.webmanifest android/app/src/main/assets/
          cp knowledge/competencies.json android/app/src/main/assets/knowledge/
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build release APK
        run: gradle --no-daemon -p android assembleRelease
      - name: Verify release APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/index.html'
          unzip -l "$APK" | grep -F 'assets/knowledge/competencies.json'
          echo 'RELEASE APK CONTENTS: PASS'
      - name: Upload unsigned release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kefayat-release-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
