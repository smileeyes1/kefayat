name: Production Gate

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ai.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'knowledge/**'
      - 'tools/**'
      - 'autonomy/**'
      - 'quality/**'
      - 'governance/**'
      - 'state/**'
      - 'baselines/**'
      - 'evidence/**'
      - 'operating/**'
      - 'GEM_KNOWLEDGE_PACK/**'
      - 'tests/**'
      - 'android/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'index.html'
      - 'ai.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'knowledge/**'
      - 'tools/**'
      - 'autonomy/**'
      - 'quality/**'
      - 'governance/**'
      - 'state/**'
      - 'baselines/**'
      - 'evidence/**'
      - 'operating/**'
      - 'GEM_KNOWLEDGE_PACK/**'
      - 'tests/**'
      - 'android/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild structured knowledge
        run: python tools/build_competencies.py
      - name: Protected verified-baseline regression
        run: python tests/test_verified_baseline_control_plane.py
      - name: Shipped JavaScript syntax gate
        run: python tests/test_index_javascript_syntax.py
      - name: Deterministic production smoke
        run: python tools/production_smoke.py
      - name: Autonomy regression
        run: python autonomy/test_controller.py
      - name: Mission-plan regression
        run: python autonomy/test_mission_plan.py
      - name: Intent-routing regression
        run: python autonomy/test_intent_routing.py
      - name: Wisdom governance regression
        run: python autonomy/test_wisdom_governance.py
      - name: Continuity and completion gate
        run: python quality/test_continuity_completion.py
      - name: Professional release gate
        run: python quality/test_professional_release.py
      - name: Release contract
        run: python quality/test_release_contract.py
      - name: Hard GO gate
        run: python quality/test_go_gate.py
      - name: Delivery contract
        run: python quality/test_delivery_contract.py

  browser-runtime:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild structured knowledge
        run: python tools/build_competencies.py
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Real Chromium desktop/mobile/offline assurance
        run: python quality/test_runtime_browser.py
      - name: Upload browser-runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kefayat-browser-runtime-evidence
          path: artifacts/runtime-browser
          if-no-files-found: error

  android-unsigned-release-build:
    needs: [smoke, browser-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build structured competency knowledge
        run: python tools/build_competencies.py
      - name: Stage production assets
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/knowledge
          cp index.html ai.html sw.js manifest.webmanifest android/app/src/main/assets/
          cp knowledge/competencies.json android/app/src/main/assets/knowledge/
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/knowledge/competencies.json
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build unsigned release APK for structural qualification
        run: gradle --no-daemon -p android assembleRelease
      - name: Verify unsigned release APK contents
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          test -s "$APK"
          echo "APK=$APK"

          LISTING="$(mktemp)"
          INDEX="$(mktemp)"
          KB="$(mktemp)"
          unzip -Z1 "$APK" > "$LISTING"
          grep -Fxq 'assets/index.html' "$LISTING"
          grep -Fxq 'assets/knowledge/competencies.json' "$LISTING"
          unzip -p "$APK" assets/index.html > "$INDEX"
          unzip -p "$APK" assets/knowledge/competencies.json > "$KB"
          grep -Fq 'كفايات Ω' "$INDEX"
          grep -Fq 'القيادة الذاتية' "$INDEX"
          python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert isinstance(d.get("records"),list) and d["records"]; print("APK knowledge records:",len(d["records"]))' "$KB"
          sha256sum "$APK" | tee android-release-sha256.txt
          printf '%s\n' "$APK" > android-release-path.txt
          echo 'UNSIGNED RELEASE APK STRUCTURAL CONTENTS: PASS'
      - name: Upload unsigned release APK and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kefayat-unsigned-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android-release-sha256.txt
            android-release-path.txt
          if-no-files-found: error
