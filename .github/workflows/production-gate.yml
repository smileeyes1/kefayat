name: Production Gate

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ai.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'knowledge/**'
      - 'tools/**'
      - 'autonomy/**'
      - 'quality/**'
      - 'governance/**'
      - 'android/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild structured knowledge
        run: python tools/build_competencies.py
      - name: Deterministic production smoke
        run: python tools/production_smoke.py
      - name: Autonomy regression
        run: python autonomy/test_controller.py
      - name: Mission-plan regression
        run: python autonomy/test_mission_plan.py
      - name: Intent-routing regression
        run: python autonomy/test_intent_routing.py
      - name: Wisdom governance regression
        run: python autonomy/test_wisdom_governance.py
      - name: Continuity and completion gate
        run: python quality/test_continuity_completion.py
      - name: Professional release gate
        run: python quality/test_professional_release.py
      - name: Release contract
        run: python quality/test_release_contract.py
      - name: Hard GO gate
        run: python quality/test_go_gate.py
      - name: Delivery contract
        run: python quality/test_delivery_contract.py

  android-release-build:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build structured competency knowledge
        run: python tools/build_competencies.py
      - name: Stage production assets
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/knowledge
          cp index.html ai.html sw.js manifest.webmanifest android/app/src/main/assets/
          cp knowledge/competencies.json android/app/src/main/assets/knowledge/
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/knowledge/competencies.json
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build release APK
        run: gradle --no-daemon -p android assembleRelease
      - name: Verify release APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/index.html'
          unzip -Z1 "$APK" | grep -Fx 'assets/knowledge/competencies.json'
          unzip -p "$APK" assets/index.html | grep -q 'كفايات Ω'
          unzip -p "$APK" assets/index.html | grep -q 'القيادة الذاتية'
          unzip -p "$APK" assets/knowledge/competencies.json | python -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("records"),list) and d["records"]; print("APK knowledge records:",len(d["records"]))'
          sha256sum "$APK" | tee android-release-sha256.txt
          echo 'RELEASE APK CONTENTS: PASS'
      - name: Upload release APK and checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kefayat-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android-release-sha256.txt
          if-no-files-found: warn
