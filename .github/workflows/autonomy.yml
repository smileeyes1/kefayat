name: Kefayat Ω Autonomous Control Loop

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'governance/verified-baseline-control-plane.md'
      - 'state/verified-state.json'
      - 'baselines/**'
      - 'evidence/imported/**'
      - 'operating/BOOTSTRAP.md'
      - 'GEM_KNOWLEDGE_PACK/00_KB_INDEX_AND_AUTHORITY.md'
      - 'GEM_KNOWLEDGE_PACK/02_MATH_VISUAL_CONSTITUTION.md'
      - 'GEM_KNOWLEDGE_PACK/KEFAYAT_OMEGA_MASTER_KNOWLEDGE_AR_v2.md'
      - 'autonomy/controller.py'
      - 'autonomy/mission-plan.json'
      - 'autonomy/test_controller.py'
      - '.github/workflows/autonomy.yml'
  workflow_dispatch:

concurrency:
  group: kefayat-autonomy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  control-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout mission state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run autonomy regression tests
        run: python3 autonomy/test_controller.py

      - name: Run autonomous controller
        run: python3 autonomy/controller.py

      - name: Persist checkpoint and evidence
        run: |
          git config user.name 'kefayat-autonomy[bot]'
          git config user.email 'kefayat-autonomy[bot]@users.noreply.github.com'
          git add autonomy/mission-state.json autonomy/evidence-ledger.jsonl
          if git diff --cached --quiet; then
            echo 'No state change; no commit required.'
          else
            git commit -m 'chore(autonomy): persist mission checkpoint'
            git push
          fi
