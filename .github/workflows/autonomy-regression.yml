name: Kefayat Ω Autonomy Regression

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rebuild structured competency knowledge
        run: python3 tools/build_competencies.py

      - name: Run adversarial autonomy regression
        run: python3 autonomy/test_controller.py

      - name: Run mission-plan regression
        run: python3 autonomy/test_mission_plan.py

      - name: Run intent-routing regression
        run: python3 autonomy/test_intent_routing.py

      - name: Run Wisdom Ω governance regression
        run: python3 autonomy/test_wisdom_governance.py

      - name: Run continuity runner regression
        run: python3 quality/test_continuity_runner.py

      - name: Run continuity and completion gate
        run: python3 quality/test_continuity_completion.py

      - name: Run production contract regression
        run: python3 quality/test_production_contract.py

      - name: Run professional release gate
        run: python3 quality/test_professional_release.py

      - name: Run release contract regression
        run: python3 quality/test_release_contract.py

      - name: Run hard GO gate
        run: python3 quality/test_go_gate.py

      - name: Verify autonomous control is bounded
        run: |
          grep -q 'SAFE_STOP' autonomy/controller.py
          grep -q 'NO CLAIM' autonomy/controller.py
          grep -q 'RECOVER_OR_ESCALATE' autonomy/controller.py
          echo 'Bounded-control invariants: PASS'
