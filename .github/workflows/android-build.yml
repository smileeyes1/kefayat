name: Android Build and Assurance

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'knowledge/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Run Android unit/build checks
        run: gradle --no-daemon -p android assembleDebug
      - name: Verify APK exists and is non-empty
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kefayat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
