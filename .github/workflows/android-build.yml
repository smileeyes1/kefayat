name: Android Build and Assurance

on:
  push:
    branches: [main, release-hardening-20260828]
    paths:
      - 'android/**'
      - 'index.html'
      - 'ai.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'knowledge/**'
      - 'raw_sources/**'
      - 'tools/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'index.html'
      - 'ai.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'knowledge/**'
      - 'raw_sources/**'
      - 'tools/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

actions:
  cancel-in-progress: true

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build structured competency knowledge
        run: python tools/build_competencies.py
      - name: Stage complete offline AI workspace into APK assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/knowledge
          cp index.html ai.html sw.js manifest.webmanifest android/app/src/main/assets/
          cp knowledge/competencies.json android/app/src/main/assets/knowledge/
          test -s android/app/src/main/assets/ai.html
          test -s android/app/src/main/assets/knowledge/competencies.json
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        run: gradle --no-daemon -p android clean assembleDebug
      - name: Verify APK exists and is non-empty
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify AI workspace and knowledge base are bundled
        run: |
          test -s android/app/build/intermediates/merged_assets/debug/mergeDebugAssets/out/ai.html
          test -s android/app/build/intermediates/merged_assets/debug/mergeDebugAssets/out/knowledge/competencies.json
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kefayat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
